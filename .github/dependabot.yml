version: 2

# Use the "bun" ecosystem so Dependabot regenerates bun.lock (which CI installs with
# --frozen-lockfile) alongside package.json. The "npm" ecosystem only rewrites
# package.json/package-lock.json and leaves bun.lock stale, so every update PR failed
# the frozen install and could never merge.
updates:
  - package-ecosystem: "bun"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "UTC"
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    groups:
      all-npm-dependencies:
        patterns:
          - "*"
    labels:
      - "dependencies"
    ignore:
      - dependency-name: "@types/node"
        versions: [">=23.0.0"]
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "UTC"
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    labels:
      - "dependencies"
      - "ci"
    commit-message:
      prefix: "chore(deps)"
