name: Security

on:
  pull_request:
  push:
    branches:
      - main
  merge_group:
    branches:
      - main
  schedule:
    - cron: "30 12 * * 1"

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  scan:
    name: ${{ matrix.scanner }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - scanner: osv-scanner
            fetch-depth: 1
          - scanner: gitleaks
            fetch-depth: 0
          - scanner: zizmor
            fetch-depth: 1
          - scanner: dependency-review
            fetch-depth: 1
          - scanner: actionlint
            fetch-depth: 1
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Harden the runner (Audit all outbound calls)
        if: matrix.scanner != 'dependency-review' || github.event_name == 'pull_request'
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout
        if: matrix.scanner != 'dependency-review' || github.event_name == 'pull_request'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: ${{ matrix.fetch-depth }}
          persist-credentials: false

      - name: Run OSV-Scanner
        if: matrix.scanner == 'osv-scanner'
        uses: google/osv-scanner-action/osv-scanner-action@a345acffa64b0eaede81a3d9aae6141214d9c8fc # v2.6.0
        with:
          scan-args: |-
            --recursive
            .

      - name: Run Gitleaks
        if: matrix.scanner == 'gitleaks'
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Run zizmor
        if: matrix.scanner == 'zizmor'
        uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Dependency Review
        if: matrix.scanner == 'dependency-review' && github.event_name == 'pull_request'
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0

      - name: Run actionlint
        if: matrix.scanner == 'actionlint'
        uses: rhysd/actionlint@914e7df21a07ef503a81201c76d2b11c789d3fca # v1.7.12

  notify-failure:
    name: Notify on failure
    needs:
      - scan
    # Pull requests already surface a red check on the PR itself, and fork PR tokens are read-only.
    if: failure() && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Open or update the security failure issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          ISSUE_TITLE: Security workflow failed
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          WORKFLOW_NAME: ${{ github.workflow }}
          TRIGGER: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          existing="$(
            gh issue list \
              --state open \
              --limit 100 \
              --search "\"$ISSUE_TITLE\" in:title" \
              --json number \
              --jq '.[0].number // empty'
          )"

          body="$(
            printf '%s\n' \
              "The $WORKFLOW_NAME workflow concluded \`failure\` on \`$REF_NAME\` ($TRIGGER, commit \`$HEAD_SHA\`)." \
              "" \
              "Run: $RUN_URL" \
              "" \
              "Review the failing leg on the run page. A lockfile advisory that has a fixed version makes the osv-scanner leg fail; bumping the affected package, refreshing the lockfile, and re-running clears it."
          )"

          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
          else
            gh issue create --title "$ISSUE_TITLE" --body "$body"
          fi
